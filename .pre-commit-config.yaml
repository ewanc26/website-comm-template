# ── pre-commit: auto-format with Prettier ──────────────────
# Runs "pnpm exec prettier --write" on staged files matching
# the configured types. Uses the project-local Prettier
# version (via pnpm), not a globally installed one.

repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, svelte]
        pass_filenames: true
