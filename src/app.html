<!doctype html>
<!-- ─── HTML Shell ──────────────────────────────────────────
     SvelteKit's root template. The %sveltekit.head% and
     %sveltekit.body% tokens are replaced at build time with
     per-page head elements and rendered content.
     The data-sveltekit-preload-data attribute hints links to
     prefetch page data on hover for near-instant navigation. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
